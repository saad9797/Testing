          - paragraph [ref=f170e163]: Assalamualikum everyone. I hope you all are doing well. It’s been a while since I posted a write-up, so here’s something interesting I found during testing.
          - paragraph [ref=f170e164]: Recently, while testing a change-email feature, I found an interesting race condition that allowed me to bypass the email verification process.
          - paragraph [ref=f170e165]: "The interesting part was simple: I was able to receive an OTP on an email address I controlled and use that OTP in a verification flow involving another email address."
          - paragraph [ref=f170e166]: This could lead to a pre-account takeover scenario without requiring access to the target email inbox.
          - paragraph [ref=f170e167]: Here is how I found it.
        - separator [ref=f170e168]
        - generic [ref=f170e174]:
          - heading "Understanding the Change Email Flow" [level=2] [ref=f170e175]
          - paragraph [ref=f170e176]: The application had a standard change-email functionality.
          - paragraph [ref=f170e177]: "The normal process was:"
          - list [ref=f170e178]:
            - listitem [ref=f170e179]: The user enters a new email address.
            - listitem [ref=f170e180]: The application sends an OTP to that email.
            - listitem [ref=f170e181]: The user enters the OTP.
            - listitem [ref=f170e182]: The application verifies the code.
            - listitem [ref=f170e183]: The email change is completed.
          - paragraph [ref=f170e184]: Nothing unusual so far.
          - paragraph [ref=f170e185]: I started testing the feature normally. I checked the usual things around the OTP flow, such as requesting multiple codes and observing how the application handled different requests.
          - paragraph [ref=f170e186]: After some testing, I decided to check how the application would behave if OTP requests for different email addresses were processed at the same time.
          - paragraph [ref=f170e187]: That is where the interesting behavior started.
        - separator [ref=f170e188]
        - generic [ref=f170e194]:
          - heading "Testing the OTP Requests in Parallel" [level=2] [ref=f170e195]
          - paragraph [ref=f170e196]: I intercepted the request responsible for generating the change-email OTP and sent it to Burp Repeater.
          - paragraph [ref=f170e197]: "The relevant part of the first request looked like this:"
          - generic [ref=f170e198]:
            - generic [ref=f170e199]: "POST /auth/email/update HTTP/2Host: [REDACTED]Content-Type: application/json"
            - generic [ref=f170e200]:
              - text: "{ \"step\": 2, \"email\": \""
              - link "attacker@example.com" [ref=f170e201] [cursor=pointer]:
                - /url: mailto:attacker@example.com
              - text: "\", \"type\": 2}"
          - paragraph [ref=f170e202]: "I then created another copy of the same request but changed the email address:"
          - generic [ref=f170e203]:
            - generic [ref=f170e204]: "POST /auth/email/update HTTP/2Host: [REDACTED]Content-Type: application/json"
            - generic [ref=f170e205]:
              - text: "{ \"step\": 2, \"email\": \""
              - link "target@example.com" [ref=f170e206] [cursor=pointer]:
                - /url: mailto:target@example.com
              - text: "\", \"type\": 2}"
          - paragraph [ref=f170e207]: "So at this point, I had two OTP requests:"
          - generic [ref=f170e208]: Request A → attacker@example.comRequest B → target@example.com
          - paragraph [ref=f170e210]: Instead of sending these requests one after another, I grouped them in Burp Repeater and sent them in parallel.
          - paragraph [ref=f170e211]: Both requests were processed.
          - paragraph [ref=f170e212]: Then I checked the email address I controlled.
          - paragraph [ref=f170e213]: "The OTP email looked like this:"
          - generic [ref=f170e214]: "Verification code: [SAME OTP]This code will be valid for the next 30 minutes."
          - paragraph [ref=f170e216]: The important observation was that the OTP generated during the concurrent requests was the same across the email-change operations.
          - paragraph [ref=f170e217]: At first, this was interesting, but the same OTP being generated was not enough to prove a serious vulnerability.
          - paragraph [ref=f170e218]: "The real question was:"
          - paragraph [ref=f170e219]:
            - strong [ref=f170e220]: Could the OTP I received on an email address I controlled be used to verify the other email-change operation?
          - generic [ref=f170e221]:
            - heading "Get Mesum Raza’s stories in your inbox" [level=2] [ref=f170e223]
            - paragraph [ref=f170e225]: Join Medium for free to get updates from this writer.
            - generic [ref=f170e226]:
              - textbox "Enter your email" [ref=f170e230]
              - button "Subscribe" [ref=f170e233]
            - generic [ref=f170e235]:
              - generic [ref=f170e236]:
                - checkbox "Remember me for faster sign in" [checked]
                - generic [ref=f170e237] [cursor=pointer]
              - paragraph [ref=f170e241]: Remember me for faster sign in
          - paragraph [ref=f170e242]: So I tested it.
        - separator [ref=f170e243]
        - generic [ref=f170e249]:
          - heading "From Interesting Behavior to Exploitation" [level=2] [ref=f170e250]
          - paragraph [ref=f170e251]: I took the OTP received on my controlled email address and used it in the verification request involving the other email address.
          - paragraph [ref=f170e252]: "The relevant part of the verification request looked like this:"
          - generic [ref=f170e253]:
            - generic [ref=f170e254]: "POST /auth/email/update HTTP/2Host: [REDACTED]Content-Type: application/json"
            - generic [ref=f170e255]:
              - text: "{ \"step\": 3, \"email\": \""
              - link "target@example.com" [ref=f170e256] [cursor=pointer]:
                - /url: mailto:target@example.com
              - text: "\", \"otp\": \"[OTP RECEIVED ON ATTACKER EMAIL]\"}"
          - paragraph [ref=f170e257]: The server accepted the request.
          - paragraph [ref=f170e258]: "The relevant response was:"
          - generic [ref=f170e259]: "HTTP/2 200 OKContent-Type: application/json{ \"status\": \"success\"}"
          - paragraph [ref=f170e261]: That was the vulnerability.
          - paragraph [ref=f170e262]: The OTP I received through an email address under my control could be used to complete another email verification flow.
          - paragraph [ref=f170e263]: "In simple words, the application was supposed to prove:"
          - blockquote [ref=f170e264]:
            - paragraph [ref=f170e265]:
              - emphasis [ref=f170e266]: You have access to this specific email address.
          - paragraph [ref=f170e267]: But because of the race condition, I could obtain the required OTP through an email address I controlled and use it in another verification context.
          - paragraph [ref=f170e268]: I did not need access to the other inbox.
        - separator [ref=f170e269]
        - generic [ref=f170e275]:
          - heading "Breaking Down the Attack" [level=2] [ref=f170e276]
          - paragraph [ref=f170e277]: The easiest way to understand the issue is with a simple example.
          - paragraph [ref=f170e278]: "Imagine there are two email addresses:"
          - generic [ref=f170e279]: Target email:target@example.comAttacker-controlled email:attacker@example.com
          - paragraph [ref=f170e281]: I prepared OTP requests for both email addresses and sent them at the same time.
          - paragraph [ref=f170e282]: "Conceptually, the result was:"
          - generic [ref=f170e283]: "Concurrent Request Aattacker@example.com │ ▼ OTP: XXXXXXConcurrent Request Btarget@example.com │ ▼ OTP: XXXXXX"
          - paragraph [ref=f170e285]:
            - text: Because I controlled
            - code [ref=f170e286]: attacker@example.com
            - text: ", I knew the OTP."
          - paragraph [ref=f170e287]: "I then used that OTP in the relevant verification flow:"
          - generic [ref=f170e288]: OTP received by attacker │ ▼Verification request │ ▼Target email context │ ▼ SUCCESS
          - paragraph [ref=f170e290]: The complexity was in finding and reproducing the race condition.
          - paragraph [ref=f170e291]: "The actual security problem was much simpler:"
          - paragraph [ref=f170e292]:
            - strong [ref=f170e293]: A verification code obtained through one email address could be used to complete a verification flow that should have required access to another email address.
        - separator [ref=f170e294]
        - generic [ref=f170e300]:
          - heading "Increasing the Impact" [level=2] [ref=f170e301]
          - paragraph [ref=f170e302]: After confirming the email verification bypass, I checked what could happen after exploitation.
          - paragraph [ref=f170e303]: One important possibility was enabling authenticator-based two-factor authentication on the affected account.
          - paragraph [ref=f170e304]: After gaining control, an attacker could configure 2FA using an authenticator under their control. This way even if the victim resets the password, 2FA will block him for logging in his own account which became an Account Deadlock, neither attacker nor victim can access the account.
          - figure [ref=f170e305]:
            - button "Press enter or click to view image in full size" [ref=f170e306]
        - separator [ref=f170e310]
        - generic [ref=f170e316]:
          - heading "Reporting the Issue" [level=2] [ref=f170e317]
          - paragraph [ref=f170e318]: After confirming the behavior, I was confident that this was not just a small issue but something that could be abused in a real scenario.
          - paragraph [ref=f170e319]: So I quickly drafted a report explaining the full flow and guess what the team reviewed it and acknowledged the issue.
