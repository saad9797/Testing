              - generic [ref=f13e466]:
                - generic [ref=f13e467]:
                  - text: At Circle, our
                  - link "mission" [ref=f13e468] [cursor=pointer]:
                    - /url: https://www.circle.com/blog/circle-mission-and-values#:~:text=Our%20mission%20is%20to%20raise,efficient%20and%20integrated%20world%20economy.
                  - text: is to raise global economic prosperity through programmable internet commerce. In support of our mission, keeping our customers’ information safe is a top priority. We recognize and appreciate the work of those in the security community who identify security vulnerabilities in our products and encourage responsible disclosure of potential security vulnerabilities as part of our Bug Bounty Program (the “Program”).
                - generic [ref=f13e469]:
                  - strong [ref=f13e470]: Before submitting a report to Circle, please carefully review the Program Terms and Conditions set forth below.
                  - text: Your participation in our Program is voluntary and subject to the below terms and conditions.
                - heading "Terms and Conditions" [level=1] [ref=f13e471]
                - heading "By submitting a security bug or vulnerability to Circle, you acknowledge that you have read and agreed to the Program Terms and Conditions set forth below. By making any submission under the Program, you agree that you may not publicly disclose your findings or the contents of your submission to any third parties without Circle’s prior written consent." [level=3] [ref=f13e472]
                - heading "Response Targets" [level=1] [ref=f13e473]
                - generic [ref=f13e474]: "Circle Internet Contract Services, LLC will endeavor to meet the following response targets for ethical hackers participating in our Program:"
                - table [ref=f13e475]:
                  - rowgroup [ref=f13e476]:
                    - row [ref=f13e477]:
                      - columnheader "Type of Response" [ref=f13e478]
                      - columnheader "SLA in business days" [ref=f13e479]
                  - rowgroup [ref=f13e480]:
                    - row [ref=f13e481]:
                      - cell "Time to first response (from report submit)" [ref=f13e482]
                      - cell "5 days" [ref=f13e483]
                    - row [ref=f13e484]:
                      - cell "Time to triage (from report submit)" [ref=f13e485]
                      - cell "10 days" [ref=f13e486]
                    - row [ref=f13e487]:
                      - cell "Time to bounty (from triage)" [ref=f13e488]
                      - cell "10 days" [ref=f13e489]
                    - row [ref=f13e490]:
                      - cell "Time to Resolution" [ref=f13e491]
                      - cell "depends on severity and complexity" [ref=f13e492]
                - generic [ref=f13e493]: If our team determines the report is valid and within the scope of our guidelines, we will make efforts to keep you informed as we work toward mitigation.
                - heading "Disclosure Policy" [level=1] [ref=f13e494]
                - list [ref=f13e495]:
                  - listitem [ref=f13e496]: Do not discuss any vulnerabilities (even resolved ones) outside of the Program without express written consent from the organization.
                  - listitem [ref=f13e497]:
                    - text: Follow HackerOne's
                    - link "disclosure guidelines" [ref=f13e498] [cursor=pointer]:
                      - /url: https://www.hackerone.com/disclosure-guidelines
                    - text: .
                - heading "Program Rules" [level=1] [ref=f13e499]
                - list [ref=f13e500]:
                  - listitem [ref=f13e501]:
                    - text: Testing should be done on
                    - link "Arc testnet" [ref=f13e502] [cursor=pointer]:
                      - /url: https://docs.arc.io/integrate/connect-to-arc
                  - listitem [ref=f13e503]: Please provide detailed reports and replicable steps. If the report is not detailed enough to reproduce the issue, the issue will not be eligible for a reward.
                  - listitem [ref=f13e504]: Submit one vulnerability per report, unless you need to chain vulnerabilities to provide impact.
                  - listitem [ref=f13e505]: When duplicates occur, we only award the first report that was received (provided that it can be fully reproduced).
                  - listitem [ref=f13e506]: Multiple vulnerabilities caused by one underlying issue will be awarded one bounty.
                  - listitem [ref=f13e507]: Social engineering (e.g. phishing, vishing, smishing) is strictly prohibited.
                  - listitem [ref=f13e508]: Make a reasonable, good faith effort to avoid privacy violations, destruction of data, and interruption or degradation of our service. Only interact with accounts or wallets you own or with the explicit permission of the account or wallet holder.
                  - listitem [ref=f13e509]: "You need to show that you could exploit a vulnerability, but you must not actually exploit it. You must not: access, modify, copy, download, delete, compromise or otherwise misuse others’ data; access non-public information without authorization; degrade, interrupt or deny services to our users; and/or incur loss of funds that are not your own."
                  - listitem [ref=f13e510]: You must be at least 18 years old.
                  - listitem [ref=f13e511]: If you are performing research, please use your own accounts and do not interact with others’ accounts or data.
                  - listitem [ref=f13e512]: Your participation in this Program must not violate any applicable laws or regulations.
                  - listitem [ref=f13e513]: You must not leverage the existence of a vulnerability or access to sensitive or confidential data to make threats, extortionate demands, or ransom requests.
                  - listitem [ref=f13e514]: You will be responsible for any tax implications related to any payment you receive under the Program, as determined by the laws of your jurisdiction.
                  - listitem [ref=f13e515]: You must not be (i) employed by Circle or any of its affiliates or (ii) an immediate family member of someone employed by Circle or any of its affiliates.
                  - listitem [ref=f13e516]: By reporting a bug, you grant Circle and its affiliates a perpetual, irrevocable, worldwide, royalty-free license to use, copy, adapt, develop, create derivative work from, or share your submission for any purpose.
                  - listitem [ref=f13e517]: By reporting a bug, you agree to allow HackerOne to share with Circle the personal information that you provide to HackerOne relating to your tax forms so Circle can perform compliance checks.
                  - listitem [ref=f13e518]: Whether Circle provides any payment for, and the amount of any such payment, is solely at Circle’s discretion.
                  - listitem [ref=f13e519]: You are prohibited from participating in the Program if you are a resident of any U.S. embargoed jurisdiction, including but not limited to Iran, North Korea, Cuba, the Crimea region, and Syria; or if you are on the U.S. Treasury Department's list of Specially Designated Nationals or the U.S. Department of Commerce Denied Persons List or Entity List. By participating in the Program, you represent and warrant that you are not located in any such country or on any such list.
                  - listitem [ref=f13e520]: We are only able to accept reports written in English.
                - heading "Test Plan" [level=1] [ref=f13e521]
                - list [ref=f13e522]:
                  - listitem [ref=f13e523]:
                    - text: Review Arc Docs on
                    - link "arc.io" [ref=f13e524] [cursor=pointer]:
                      - /url: https://arc.io
                  - listitem [ref=f13e525]:
                    - text: Perform your testing on either a local dev.net or
                    - link "Arc testnet" [ref=f13e526] [cursor=pointer]:
                      - /url: https://docs.arc.io/integrate/connect-to-arc
                - strong [ref=f13e528]: Please refrain from testing on the mainnet environment.
                - heading "Documents" [level=2] [ref=f13e529]
                - list [ref=f13e530]:
                  - listitem [ref=f13e531]:
                    - text: Arc Docs on
                    - link "arc.io" [ref=f13e532] [cursor=pointer]:
                      - /url: https://arc.io
                  - listitem [ref=f13e533]:
                    - text: Connect to Arc
                    - link "Arc testnet" [ref=f13e534] [cursor=pointer]:
                      - /url: https://docs.arc.io/integrate/connect-to-arc
                - heading "Out of scope vulnerabilities" [level=1] [ref=f13e535]
                - heading "When reporting vulnerabilities, please consider (1) attack scenario / exploitability, and (2) security impact of the bug. The following issues are considered out of scope:" [level=3] [ref=f13e536]
                - list [ref=f13e537]:
                  - listitem [ref=f13e538]: Vulnerabilities that require source manipulation to perform
                  - listitem [ref=f13e539]: Vulnerabilities in unit tests
                  - listitem [ref=f13e540]: Clickjacking on pages with no sensitive actions
                  - listitem [ref=f13e541]: Cross-Site Request Forgery (CSRF) on unauthenticated forms or forms with no sensitive actions
                  - listitem [ref=f13e542]: Attacks requiring MITM or physical access to a user's device.
                  - listitem [ref=f13e543]: Previously known vulnerable libraries without a working Proof of Concept.
                  - listitem [ref=f13e544]: Comma Separated Values (CSV) injection without demonstrating a vulnerability.
                  - listitem [ref=f13e545]: Missing best practices in SSL/TLS configuration.
                  - listitem [ref=f13e546]: Any activity that could lead to the disruption of our service (DoS).
                  - listitem [ref=f13e547]: Content spoofing and text injection issues without showing an attack vector/without being able to modify HTML/CSS
                  - listitem [ref=f13e548]: Rate limiting or bruteforce issues on non-authentication endpoints
                  - listitem [ref=f13e549]: Missing best practices in Content Security Policy.
                  - listitem [ref=f13e550]: Missing HttpOnly or Secure flags on cookies
                  - listitem [ref=f13e551]: Missing email best practices (Invalid, incomplete or missing SPF/DKIM/DMARC records, etc.)
                  - listitem [ref=f13e552]: Vulnerabilities only affecting users of outdated or unpatched browsers [Less than 2 stable versions behind the latest released stable version]
                  - listitem [ref=f13e553]: Vulnerabilities only affecting outdated versions of mobile applications [any version that is not the current stable version] or mobile applications not directly downloaded from the Apple or Google Play App Store.
                  - listitem [ref=f13e554]: Software version disclosure / Banner identification issues / Descriptive error messages or headers (e.g. stack traces, application or server errors).
                  - listitem [ref=f13e555]: Public Zero-day vulnerabilities that have had an official patch for less than 1 month will be awarded on a case by case basis.
                  - listitem [ref=f13e556]: Tabnabbing
                  - listitem [ref=f13e557]: Open redirect - unless an additional security impact can be demonstrated
                  - listitem [ref=f13e558]: Issues that require unlikely user interaction
                - heading "Safe Harbor" [level=1] [ref=f13e559]
                - generic [ref=f13e560]: Any activities conducted in a manner consistent with these Terms and Conditions will be considered authorized conduct and we will not initiate legal action against you. If legal action is initiated by a third party against you in connection with activities conducted under these Terms and Conditions, we will take steps to make it known that your actions were conducted in compliance with these Terms and Conditions.
                - generic [ref=f13e561]: We may modify these Terms and Conditions or end the Program at any time without notice.
                - generic [ref=f13e562]: Thank you for helping keep Circle and our community safe!
