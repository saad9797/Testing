            - generic [ref=f17e307]:
              - generic [ref=f17e309]:
                - heading "Overview" [level=2] [ref=f17e310]
                - generic [ref=f17e312]:
                  - generic [ref=f17e313]: Last updated on September 3, 2026.
                  - link "View changes" [ref=f17e314] [cursor=pointer]:
                    - /url: /abercrombie_fitch_bbp/policy_versions
              - generic [ref=f17e322]:
                - generic [ref=f17e323]: Abercrombie & Fitch Management Co. (ANF) looks forward to working with the security community to find vulnerabilities in order to keep our businesses and customers safe.
                - heading "Safe Harbor" [level=1] [ref=f17e324]
                - generic [ref=f17e325]: Any activities conducted in a manner consistent with this policy will be considered authorized conduct and we will not initiate legal action against you. If legal action is initiated by a third party against you in connection with activities conducted consistently with this policy, we will take steps to make it known that your actions were authorized.
                - heading "Disclosure Policy" [level=1] [ref=f17e326]
                - list [ref=f17e327]:
                  - listitem [ref=f17e328]: Please do not discuss this program or any vulnerabilities (even resolved ones) outside of the program without express written consent from Abercrombie & Fitch Management Co.
                  - listitem [ref=f17e329]:
                    - text: Follow HackerOne's
                    - link "disclosure guidelines" [ref=f17e330] [cursor=pointer]:
                      - /url: https://www.hackerone.com/disclosure-guidelines
                    - text: .
                - heading "Program Rules" [level=1] [ref=f17e331]
                - generic [ref=f17e332]: Please provide detailed reports with reproducible steps. If the report is not detailed enough to reproduce the issue, the issue will not be eligible for a reward.
                - list [ref=f17e333]:
                  - listitem [ref=f17e334]: We are continuously scanning our applications for vulnerabilities. Abercrombie & Fitch will operate in good faith to pay out net new vulnerabilities disclosed through this program. Findings related to newly released CVEs will be evaluated against Abercrombie & Fitch’s existing vulnerability management processes. Cases in which the vulnerability has already been triaged and slated for remediation within SLAs will be treated as a duplicate findings.
                  - listitem [ref=f17e335]: Submit one vulnerability per report, unless you need to chain vulnerabilities to provide impact. Multiple vulnerabilities caused by one underlying issue will be awarded one bounty.
                  - listitem [ref=f17e336]: When duplicates occur, we only award the first report that was received (provided that it can be fully reproduced).
                  - listitem [ref=f17e337]: If using a publicly available POC / exploit, please provide the source. This helps ANF understand risk, impact and remediate. Leveraging public POCs will not result in reduced bounty. Providing sources of lesser-known successful exploits may result in a bonus reward.
                  - listitem [ref=f17e338]: Exfiltration and/or exposure of personally identifiable information is expressly prohibited. If you believe a vulnerability exists where PII may be exposed, please ensure you are using your own test accounts for POC.
                  - listitem [ref=f17e339]: If submitting a ticket regarding found system credentials, researchers must provide the source. Credentials must not be used to access underlying systems. Tickets will be evaluated and assigned a value at ANF's discretion based on the class of identity and its level of access.
                  - listitem [ref=f17e340]: Social engineering (e.g. phishing, vishing, smishing) including interactions with customer service or chat agents is prohibited.
                  - listitem [ref=f17e341]: Make a good faith effort to avoid privacy violations, destruction of data, and interruption or degradation of our service. Only interact with accounts you own.
                  - listitem [ref=f17e342]: A&F corporate employees, contractors (past and current), and connected entities are not eligible for participation in this program.
                  - listitem [ref=f17e343]: Abercrombie’s and Hollister Co.’s underlying architecture is the same. The same rule can be applied to exposed non-prod environments if found. Refrain from submitting a duplicate report for the other domain or environment.
                - heading "Test Plan" [level=1] [ref=f17e344]
                - list [ref=f17e345]:
                  - listitem [ref=f17e346]:
                    - text: "We strongly recommend the use of a modified a user agent in your HTTP(S) requests, and for non-HTTP requests we strongly recommend you add an identification to artifacts in POCs, and, or payloads so our teams can identify you as a verified researcher and not a malicious attacker: (e.g. h1:"
                    - code [ref=f17e347]: <bbp-hackeroneusername>
                    - text: ).
                  - listitem [ref=f17e348]:
                    - text: No credentials are required or provided for this program. If you self-register for any accounts, please register with your
                    - link "@wearehackerone" [ref=f17e349] [cursor=pointer]:
                      - /url: https://hackerone.com/wearehackerone
                    - text: .com email address. You may not use exposed credentials to continue testing without explicit written approval of Abercrombie & Fitch Management Co.
                - heading "Out of scope vulnerabilities" [level=1] [ref=f17e350]
                - heading "When reporting vulnerabilities, please consider (1) attack scenario / exploitability, and (2) security impact of the bug. The following issues are considered out of scope:" [level=3] [ref=f17e351]
                - list [ref=f17e352]:
                  - listitem [ref=f17e353]: Clickjacking on pages with no sensitive actions
                  - listitem [ref=f17e354]: Cross-Site Request Forgery (CSRF) on unauthenticated forms or forms with no sensitive actions
                  - listitem [ref=f17e355]: Attacks requiring MITM or physical access to a user's device.
                  - listitem [ref=f17e356]: Previously known vulnerable libraries without a working Proof of Concept.
                  - listitem [ref=f17e357]: Comma Separated Values (CSV) injection without demonstrating a vulnerability.
                  - listitem [ref=f17e358]: Missing best practices in SSL/TLS configuration.
                  - listitem [ref=f17e359]: Any activity that could lead to the disruption of our service (DoS).
                  - listitem [ref=f17e360]: Content spoofing and text injection issues without showing an attack vector/without being able to modify HTML/CSS
                  - listitem [ref=f17e361]: Rate limiting, bruteforce or enumeration issues on non-authentication endpoints
                  - listitem [ref=f17e362]: Missing best practices in Content Security Policy.
                  - listitem [ref=f17e363]: Missing email best practices (Invalid, incomplete or missing SPF/DKIM/DMARC records, etc.)
                  - listitem [ref=f17e364]: Vulnerabilities only affecting users of outdated or unpatched browsers [Less than 2 stable versions behind the latest released stable version]
                  - listitem [ref=f17e365]: Software version disclosure / Banner identification issues / Descriptive error messages or headers (e.g. stack traces, application or server errors) without PoC are considered informational.
                  - listitem [ref=f17e366]: Public Zero-day vulnerabilities that have had an official patch for less than 1 month will be awarded on a case by case basis.
                  - listitem [ref=f17e367]: Tabnabbing and typosquatting
                  - listitem [ref=f17e368]: Open redirect - unless an additional security impact can be demonstrated
                  - listitem [ref=f17e369]: Issues that require unlikely user interaction, including but not limited to phishing.
                  - listitem [ref=f17e370]: Promotional code abuse
                  - listitem [ref=f17e371]: Social Engineering of customer service agents via voice or chat
                - heading "Response Targets" [level=1] [ref=f17e372]
                - generic [ref=f17e373]: "Abercrombie & Fitch Management Co. will make a best effort to meet the following SLAs for hackers participating in our program:"
