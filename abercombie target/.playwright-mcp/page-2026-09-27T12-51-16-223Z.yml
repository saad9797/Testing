                - generic [ref=f17e289]:
                  - heading "Rewards" [level=1] [ref=f17e290]
                  - generic [ref=f17e291]: Our rewards are based on severity per CVSS (the Common Vulnerability Scoring Standard). Please note these are general guidelines, and reward decisions are up to the discretion of Abercrombie & Fitch Management Co.
            - generic [ref=f17e292]:
              - heading "Scope exclusions" [level=2] [ref=f17e295]
