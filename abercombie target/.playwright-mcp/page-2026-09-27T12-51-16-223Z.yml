                      - cell "depends on severity and complexity" [ref=f17e393]
                - generic [ref=f17e394]: We’ll try to keep you informed about our progress throughout the process.
                - generic [ref=f17e395]: Thank you for helping keep Abercrombie & Fitch Management Co. and our users safe!
