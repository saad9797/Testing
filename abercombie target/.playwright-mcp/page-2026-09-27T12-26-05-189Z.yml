                    - text: )
                - heading "Focus Areas" [level=3] [ref=e312]
                - generic [ref=e313]: "We are particularly interested in reports that cover:"
                - list [ref=e314]:
                  - listitem [ref=e315]:
                    - strong [ref=e316]: Authorization and authentication bypass
                    - text: in framework-level primitives, especially where a default configuration leaves a protection unenforced
                  - listitem [ref=e317]:
                    - strong [ref=e318]: "AI agent security:"
                    - text: tool execution control bypasses, MCP client trust boundary violations, and credential or session leakage through agent framework components
                  - listitem [ref=e319]:
                    - strong [ref=e320]: Cache poisoning and response integrity violations
                    - text: that cause one user's data to be served to another
                  - listitem [ref=e321]:
                    - strong [ref=e322]: Supply chain attacks
                    - text: against published packages and skill registries
                  - listitem [ref=e323]:
                    - strong [ref=e324]: Server-side vulnerabilities
                    - text: (SSRF, RCE, path traversal) reachable in default or widely-used configurations
                  - listitem [ref=e325]:
                    - strong [ref=e326]: Cross-user or cross-session data leakage
                    - text: through shared state, shared caches, or insufficient isolation
                - generic [ref=e327]:
                  - text: See the
                  - link "Per-Asset Focus Areas" [ref=e328] [cursor=pointer]:
