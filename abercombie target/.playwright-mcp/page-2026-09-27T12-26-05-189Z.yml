                  - text: section for the specific vulnerability classes and priority guidance for each project.
                - heading "Scope" [level=2] [ref=e329]
                - heading "Tier 1 (High Priority)" [level=3] [ref=e330]
                - generic [ref=e331]: Official Vercel-maintained open source projects with the broadest production usage and highest ecosystem impact. These projects are actively used by millions of developers and represent the core of Vercel's open source portfolio. Reports against Tier 1 assets receive the highest bounty consideration and are reviewed with priority.
