                - heading "Response Targets" [level=2] [ref=f4e584]
                - generic [ref=f4e585]: "8x8 will make a best effort to meet the following response targets for hackers participating in our program:"
                - list [ref=f4e586]:
                  - listitem [ref=f4e587]: Time to first response (from report submit) - 1 business days
                  - listitem [ref=f4e588]: Time to triage (from report submit) - 2 business days
                - heading "Disclosure Policy" [level=2] [ref=f4e589]
                - list [ref=f4e590]:
                  - listitem [ref=f4e591]: Let us know as soon as possible upon discovery of a potential security issue, and we'll make every effort to quickly resolve the issue.
                  - listitem [ref=f4e592]: Please do not discuss vulnerabilities outside of the program without proper coordination and express consent from 8x8.
                  - listitem [ref=f4e593]: Make a good faith effort to avoid privacy violations, destruction of data, and interruption or degradation of our service.
                  - listitem [ref=f4e594]: Only interact with accounts you own or with explicit permission of the account holder. Please notify us immediately if you encounter exposure of information.
                  - listitem [ref=f4e595]:
                    - text: Follow HackerOne's
                    - link "disclosure guidelines" [ref=f4e596] [cursor=pointer]:
                      - /url: https://www.hackerone.com/disclosure-guidelines
                    - text: .
                - heading "Scope Exclusions" [level=2] [ref=f4e597]
                - heading "Testing Conduct" [level=3] [ref=f4e598]
                - generic [ref=f4e599]: "Please do not:"
                - list [ref=f4e600]:
                  - listitem [ref=f4e601]: Conduct automated or high-volume testing without prior coordination
                  - listitem [ref=f4e602]: Perform any activity that could disrupt our service (DoS/DDoS)
                  - listitem [ref=f4e603]: Send spam or unsolicited communications
                  - listitem [ref=f4e604]: Engage in social engineering or phishing of 8x8 staff or contractors
                  - listitem [ref=f4e605]: Make physical attempts against 8x8 property or data centers
                - heading "Mobile-Specific Exclusions" [level=3] [ref=f4e606]
                - list [ref=f4e607]:
                  - listitem [ref=f4e608]: Findings requiring a malicious or attacker-controlled application installed on the victim's device
                  - listitem [ref=f4e609]: Same-device cross-application attacks via Android intents, activities, services, broadcast receivers, content providers, IPC mechanisms, overlays, or accessibility features
                  - listitem [ref=f4e610]: Task hijacking (StrandHogg) vulnerabilities
                  - listitem [ref=f4e611]: Insecure data storage on rooted or jailbroken devices
                  - listitem [ref=f4e612]: Issues requiring local code execution in the context of another application
                - heading "Common Low-Impact Issues" [level=3] [ref=f4e613]
                - list [ref=f4e614]:
                  - listitem [ref=f4e615]: Missing security headers (HSTS, CSP, SPF, DMARC, X-Frame-Options, etc.)
                  - listitem [ref=f4e616]: Missing cookie flags (Secure, HttpOnly, SameSite) without demonstrated exploit
                  - listitem [ref=f4e617]: SSL/TLS configuration issues (weak ciphers, key size, deprecated protocols, BEAST, CRIME)
                  - listitem [ref=f4e618]: Software version disclosure, banner identification, or descriptive error messages
                  - listitem [ref=f4e619]: Clickjacking on non-sensitive pages
                  - listitem [ref=f4e620]: Self-XSS without further security impact
                  - listitem [ref=f4e621]: CSRF on unauthenticated forms or forms with no sensitive action
                  - listitem [ref=f4e622]: CSV injection without demonstrated impact
                  - listitem [ref=f4e623]: Tab-nabbing
                - heading "Authentication & Access Control" [level=3] [ref=f4e624]
                - list [ref=f4e625]:
                  - listitem [ref=f4e626]: Credential stuffing attacks (users are responsible for password uniqueness and enabling MFA)
                  - listitem [ref=f4e627]: Rate limiting or brute force issues without demonstrated account compromise
                  - listitem [ref=f4e628]: Issues requiring MITM or physical access to a user's device
                - heading "Dependencies & Browsers" [level=3] [ref=f4e629]
                - list [ref=f4e630]:
                  - listitem [ref=f4e631]: Vulnerable libraries or dependencies without a demonstrated Proof of Concept showing exploitability in our application context
                  - listitem [ref=f4e632]: Issues only affecting outdated browsers (more than 2 stable versions behind current release)
                - heading "Disclosure Timing" [level=3] [ref=f4e633]
                - list [ref=f4e634]:
                  - listitem [ref=f4e635]: Public zero-day vulnerabilities patched less than 1 month ago (evaluated case-by-case)
                - heading "Scanner Findings" [level=3] [ref=f4e636]
                - list [ref=f4e637]:
                  - listitem [ref=f4e638]: Low-severity issues reported by automated scanners without demonstrated security impact or exploitation path
                - heading "Target Specific Scope Exclusion - connect.8x8.com" [level=3] [ref=f4e639]
                - list [ref=f4e640]:
                  - listitem [ref=f4e641]:
                    - text: IDORs having unguessable/non-enumerable identifier are out of scope
                    - list [ref=f4e642]:
                      - listitem [ref=f4e643]: IDORs in form of an UUID
                      - listitem [ref=f4e644]:
                        - text: IDORs based on
                        - code [ref=f4e645]: AccountId
                        - text: and
                        - code [ref=f4e646]: subAccountId
                  - listitem [ref=f4e647]: When testing support functionality please add "HackerOne" in your subject line and limit the number of requests to an absolute minimum.
                - heading "Testing Identification" [level=2] [ref=f4e648]
                - list [ref=f4e649]:
                  - listitem [ref=f4e650]:
                    - text: Please utilize your [username]
                    - link "@wearehackerone" [ref=f4e651] [cursor=pointer]:
                      - /url: /wearehackerone
                    - text: .com alias when submitting information within the applications.
                  - listitem [ref=f4e652]:
                    - text: To help us identify and classify researcher traffic, 8x8 requests you to include your HackerOne username value to each and every HTTP request made by yourself or any tooling you use. Please use the following format appended to
                    - code [ref=f4e653]: User-Agent
                    - text: ":"
                    - code [ref=f4e654]: "X-HackerOne: [H1 username]"
                - heading "Safe Harbor" [level=2] [ref=f4e655]
                - generic [ref=f4e656]:
                  - text: The
                  - link "Gold Standard Safe Harbor" [ref=f4e657] [cursor=pointer]:
                    - /url: https://hackerone.com/8x8-bounty/safe_harbor
                  - text: applies.
