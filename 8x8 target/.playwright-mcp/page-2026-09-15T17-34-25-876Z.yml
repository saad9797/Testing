            - generic [ref=f8e140]: Gold Standard Safe Harbor
            - generic [ref=f8e142]:
              - generic [ref=f8e143]: Gold Standard Safe Harbor supports the protection of organizations and hackers engaged in Good Faith Security Research. "Good Faith Security Research" is accessing a computer solely for purposes of good-faith testing, investigation, and/or correction of a security flaw or vulnerability, where such activity is carried out in a manner designed to avoid any harm to individuals or the public, and where the information derived from the activity is used primarily to promote the security or safety of the class of devices, machines, or online services to which the accessed computer belongs, or those who use such devices, machines, or online services.
              - generic [ref=f8e144]: We consider Good Faith Security Research to be authorized activity that is protected from adversarial legal action by us. We waive any relevant restriction in our Terms of Service ("TOS") and/or Acceptable Use Policies ("AUP") that conflicts with the standard for Good Faith Security Research outlined here.
              - generic [ref=f8e145]: "This means that, for activity conducted while this program is active, we:"
              - list [ref=f8e146]:
                - listitem [ref=f8e147]:
                  - strong [ref=f8e148]: Will not
                  - text: bring legal action against you or report you for Good Faith Security Research, including for bypassing technological measures we use to protect the applications in scope; and,
                - listitem [ref=f8e149]:
                  - strong [ref=f8e150]: Will
                  - text: take steps to make known that you conducted Good Faith Security Research if someone else brings legal action against you.
              - generic [ref=f8e151]: You should contact us for clarification before engaging in conduct that you think may be inconsistent with Good Faith Security Research or unaddressed by our policy.
              - generic [ref=f8e152]: Keep in mind that we are not able to authorize security research on third-party infrastructure, and a third party is not bound by this safe harbor statement.
