              - generic [ref=e310]:
                - heading "Rewards" [level=1] [ref=e311]
                - generic [ref=e312]: We have different rewards depending on the business impact of each asset. A more complete description of each asset will be in the scope section, but in general GitLab.com and all our products' source code is rewarded the highest, then non-production environments have reduced bounties and our static websites have the lowest payouts.
                - generic [ref=e313]:
                  - text: See the Rewards section above for our bounty ranges. For reports with critical or high severity we pay $1000 at the time the report is triaged, and for medium severity reports we pay $500. The remainder, if any, will be paid as soon as the severity has been fully analyzed internally. The calculator we use to calculate CVSS-based bounty amounts is
                  - link "accessible to everyone" [ref=e314] [cursor=pointer]:
                    - /url: https://gitlab-com.gitlab.io/gl-security/appsec/cvss-calculator/
                  - text: .
                - generic [ref=e315]: Reports about intended behavior resulting in an update of our documentation will be rewarded with a $100 bounty, as long as this update is security related.
                - generic [ref=e316]: GitLab assigns CVE identifiers to vulnerabilities affecting GitLab products. While the CVSS score for those should generally align with the severity set in the HackerOne report, sometimes they will differ depending on our assessment of the business impact based on existing mitigations, the sensitivity of the impacted data, and number of impacted customers among other factors.
                - generic [ref=e317]: While we try to be as consistent as possible with rewards, our program is also evolving and rewards may change accordingly to how our program evolves with time.
                - generic [ref=e318]:
                  - text: For valid reports for which the author can't accept monetary rewards, we offer to plant trees in our
                  - link "GitLab forest" [ref=e319] [cursor=pointer]:
                    - /url: https://tree-nation.com/trees/view/5119567
                  - text: on their behalf.
                - heading "GitLab Ultimate License" [level=2] [ref=e320]
                - generic [ref=e321]:
                  - text: Reporters which have submitted three or more valid findings to our program are eligible to receive a one year self-hosted Ultimate license supporting up to five users. If you believe you're eligible, please request the Ultimate license via a comment in one of your reports mentioning the assigned security engineer, and include links to your other two valid reports. Once verified, the license will be sent to your
                  - code [ref=e322]: "[username]@wearehackerone.com"
                  - text: email address. Any further valid submissions in that year will extend you the next year's license for free too.
                - heading "How severity is determined" [level=2] [ref=e323]
                - generic [ref=e324]:
                  - text: Upon receipt of the finding, we will conduct an internal investigation to understand the full impact of the vulnerability. We then assess the severity using the Common Vulnerability Scoring System (CVSS) and score according to the guidelines you can see in the "help & definitions" section of our
                  - link "CVSS calculator" [ref=e325] [cursor=pointer]:
                    - /url: https://gitlab-com.gitlab.io/gl-security/appsec/cvss-calculator/
                  - text: ". Note that even if GitLab.com allows self-registration, most GitLab instances in the wild don't -- which makes vulnerabilities that are exploitable without authentication a lot more impactful. For this reason, any vulnerability that requires an account will not be scored with \"Privilege Required: None\"."
                - generic [ref=e326]: Reports for security issues that aren't vulnerabilities in our systems and where CVSS isn't appropriate (for example a leaked confidential document) will receive a discretionary bounty based on our assessment of the impact of the finding.
                - generic [ref=e327]:
                  - text: We collaborate with HackerOne Triage Service for quickly identifying valid and impactful reports. By-passing the HackerOne triage service by opening issues in GitLab project or reaching out to GitLab team members directly on reports or via other mediums is a violation of
                  - link "HackerOne Code of Conduct (CoC)" [ref=e328] [cursor=pointer]:
                    - /url: https://www.hackerone.com/policies/code-of-conduct
                  - text: and might attract CoC enforcement actions.
                - generic [ref=e329]: CVSS scores and bounty awards are determined by the consensus of the GitLab Bug Bounty Council. Multiple team members review and validate the CVSS for each triaged report to ensure accurate and impartial assessments. Reporters can raise concerns if they believe a CVSS metric has been misjudged. However, the final decision on CVSS scoring and bounty awards rests with the council.
                - heading "Duplicates" [level=2] [ref=e330]
                - generic [ref=e331]: For different attack vectors that result in the same mitigation, GitLab reserves the right to reward the first report that is validated for that fix. All subsequent reports that are addressed by that mitigation will be considered as duplicates, regardless of the attack vector.
                - heading "Rules of Engagement, Testing, and Proof-of-concepts" [level=1] [ref=e332]
                - generic [ref=e333]: "When researching security issues, especially those which may compromise the privacy of others, you must use only test accounts in order to respect our users’ privacy. Accessing private information of other users, performing actions that may negatively affect GitLab’s users (e.g., spam, denial of service) will disqualify the report. Activity that is disruptive to GitLab operations will result in account bans and disqualification of the report. Examples of disruptive activity include, but are not limited to:"
                - list [ref=e334]:
                  - listitem [ref=e335]: Generating abuse requests
                  - listitem [ref=e336]: Submission of support, sales or other requests to 3rd party systems
                  - listitem [ref=e337]: Mass creation of users, groups, and projects
                  - listitem [ref=e338]: Typosquatting or other namesquatting
                  - listitem [ref=e339]: Spam-like or other high volume activity
                - generic [ref=e340]: Sending reports from automated tools without verifying them will immediately disqualify the report.
                - generic [ref=e341]:
                  - text: Disruptive activity such as that listed above can be researched freely on your own installation of
                  - code [ref=e342]: gitlab
                  - text: . GitLab is an open-core company, with the source code powering GitLab.com available in the
                  - link "main GitLab Project" [ref=e343] [cursor=pointer]:
                    - /url: https://gitlab.com/gitlab-org/gitlab
                  - text: . You are encouraged to
                  - link "install" [ref=e344] [cursor=pointer]:
                    - /url: https://about.gitlab.com/install/
                  - text: your own standalone instance for researching vulnerabilities.
                - generic [ref=e345]: "Due to an increase in low-quality AI-generated submissions, all reports must include one of the following reproduction artifacts: screen captures, videos, and logs showing vulnerabilities against your own GitLab installation. Reports without sufficient and verifiable evidence will be closed as N/A without further investigation and will not be considered as the original submission when it comes to duplication handling."
                - generic [ref=e346]:
                  - strong [ref=e347]:
                    - text: We strongly encourage security testing on your local
                    - link "GitLab Development Kit (GDK)" [ref=e348] [cursor=pointer]:
                      - /url: https://gitlab.com/gitlab-org/gitlab-development-kit
                    - text: instance
                  - text: "rather than GitLab.com for most vulnerability research. The GDK provides:"
                - list [ref=e349]:
                  - listitem [ref=e350]: Access to the latest development features before public release
                  - listitem [ref=e351]: No rate limits or testing restrictions on your local instance
                  - listitem [ref=e352]: Safe environment for testing most vulnerability types
                  - listitem [ref=e353]: "[GDK Security Testing Guide - link to create]"
                - generic [ref=e354]:
                  - strong [ref=e355]: "For Denial of Service (DoS) vulnerabilities specifically:"
                  - text: Testing and demonstrating DoS impact on a local GDK instance can be problematic. If you need to demonstrate DoS impact, we recommend testing on a self-managed GitLab instance with specifications and resources equal to or greater than the
                  - link "self-managed GitLab installation requirements" [ref=e356] [cursor=pointer]:
                    - /url: https://docs.gitlab.com/install/requirements/
                  - text: .
                  - strong [ref=e357]: Never test DoS vulnerabilities on GitLab.com.
                - generic [ref=e358]:
                  - text: For vulnerabilities requiring GitLab.com production architecture, you must use test accounts created with your HackerOne email alias (
                  - link "yourhandle@wearehackerone.com" [ref=e359] [cursor=pointer]:
                    - /url: mailto:yourhandle@wearehackerone.com
                  - text: ).
                  - strong [ref=e360]: Never test against projects, groups, accounts, or instances you do not own.
                - generic [ref=e361]:
                  - strong [ref=e362]: Behave professionally
                  - text: . Failure to follow HackerOne's policies, such as the
                  - link "Code of Conduct" [ref=e363] [cursor=pointer]:
                    - /url: https://www.hackerone.com/policies/code-of-conduct
                  - text: ", may result in the report being ineligible for a bounty at GitLab's sole discretion, in addition to any enforcement action HackerOne may decide to take."
                - heading "Demonstrating Impact" [level=2] [ref=e364]
                - list [ref=e365]:
                  - listitem [ref=e366]: Always choose a non disruptive option to demonstrate the impact. If the only way to demonstrate an impact is a disruptive one then stop and report the issue, we will validate the impact.
                  - listitem [ref=e367]: In the case of reports related to credential leaks do not create additional access credentials using the leaked one. We will determine impact ourselves and award for the maximum impact we uncover.
                  - listitem [ref=e368]:
                    - text: In the case of reports related to Subdomain Takeovers, PoC's should create a simple page with your HackerOne handle as a single line of text at the affected URL. The page should utilize a UUID or complex string that wouldn't ordinarily be accessed. An example would be
                    - code [ref=e369]: vulnerable-subdomain.example.com/$UUID-poc.txt
                    - text: where $UUID is a hard-to-guess value.
                  - listitem [ref=e370]: For sharing POC videos, directly upload the video in the report. Do not upload POC videos in public platforms until the report is disclosed. Please refer to our disclosure policy for more details.
                - heading "Testing on GitLab.com" [level=2] [ref=e371]
                - generic [ref=e372]:
                  - strong [ref=e373]:
                    - text: When testing on GitLab.com, your
                    - code [ref=e374]: "@wearehackerone.com"
                    - text: address must be associated with the testing account.
                  - text: If separate accounts are necessary,
                  - link "you can use an alias" [ref=e375] [cursor=pointer]:
                    - /url: https://docs.hackerone.com/hackers/hacker-email-alias.html#multiple-aliases
                  - text: . This will help us separate testing from other forms of abuse, and help inform the decision of blocking an account. Note that this does not provide immunity and the Rules of engagement must be followed at all times.
                - generic [ref=e376]: Please keep note of any IP addresses you use during your research, as this can help us when investigating and remediating vulnerabilities.
                - generic [ref=e377]: Please don't request Developer access to our projects, including the GitLab Community Forks group. While it can indeed be a security risk for the company that a random person joins those projects, it is something the security team handles and we don't want bug bounty hunters to test those workflows as it creates unnecessary noise for our teams.
                - heading "SLA" [level=1] [ref=e378]
                - generic [ref=e379]: "GitLab will make a best effort to meet the following SLAs for hackers participating in our program:"
                - list [ref=e380]:
                  - listitem [ref=e381]: Time to first response (from report submit) - 1 business day
                  - listitem [ref=e382]: Time to triage (from report submit) - 5 business days
                  - listitem [ref=e383]: Time to bounty (from triage) - between 5 and 45 business days
                - generic [ref=e384]: The only appropriate place to inquire about a HackerOne report's status is on the report itself. Please refrain from submitting your report or inquiring about its status through additional channels including any other unrelated HackerOne report, as this unnecessarily binds resources in the security team.
                - heading "Scope" [level=1] [ref=e385]
                - generic [ref=e386]: All GitLab Inc. products are in scope unless explicitly noted otherwise.
                - generic [ref=e387]:
                  - text: Testing on subdomains that are neither explicitly in scope nor out of scope isn't encouraged, but if you can find a vulnerability with business impact on such a subdomain please report it. We normally close sufficiently clear reports as
                  - code [ref=e388]: Informative
                  - text: so there will be
                  - link "no negative effect" [ref=e389] [cursor=pointer]:
                    - /url: https://www.hackerone.com/blog/reputation-signal-impact-enhancements-whats-changing-and-why-it-matters
                  - text: on your reputation score if we decide that it's out of scope. However, remember that GitLab subdomains that are running third party services are strictly out of scope.
                - heading "GitLab Releases" [level=2] [ref=e390]
                - generic [ref=e391]:
                  - text: We release new features every month. You can
                  - link "learn more about our release process" [ref=e392] [cursor=pointer]:
                    - /url: https://about.gitlab.com/releases/
                  - text: ", see the latest"
                  - link "monthly release blog post" [ref=e393] [cursor=pointer]:
                    - /url: https://about.gitlab.com/releases/categories/releases/
                  - text: and see what's coming in
                  - link "future releases" [ref=e394] [cursor=pointer]:
                    - /url: https://about.gitlab.com/upcoming-releases/
                  - text: . If you're bug hunting, might we suggest a newly released feature? 😉
                - heading "Vulnerabilities in 3rd-party dependencies & packaged software" [level=2] [ref=e395]
                - generic [ref=e396]: "Reports on vulnerabilities in third-party software which GitLab depends on will be accepted and a bounty rewarded if and only if:"
                - list [ref=e397]:
                  - listitem [ref=e398]: The report includes a new vulnerability, for which a patch is not available, or
                  - listitem [ref=e399]: A patch has been available for more than 30 days.
                  - listitem [ref=e400]: It has a clear and working proof of concept that illustrates the impact to GitLab.
                  - listitem [ref=e401]: It has Critical or High impact to GitLab.
                - generic [ref=e402]:
                  - text: This does
                  - insertion [ref=e403]: not
                  - text: include websites of third party software and services and only includes dependencies & packaged software.
                - heading "AI related vulnerabilities" [level=3] [ref=e404]
                - generic [ref=e405]:
                  - text: We only accept prompt injection related vulnerability reports where there is demonstrable impact beyond its current security boundary. GitLab continues to develop security protections for Duo and agentic systems which can be referred to
                  - link "here" [ref=e406] [cursor=pointer]:
                    - /url: https://docs.gitlab.com/user/duo_agent_platform/security_threats/
                  - text: . Stay tuned for further iterations to the Bug Bounty program around AI related vulnerabilites in the near future.
                - generic [ref=e407]:
                  - text: Below is a running table of known prompt injection vulnerabilities that are
                  - strong [ref=e408]: out of scope
                  - text: for the GitLab bug bounty program. Do not submit reports for these specific known instances.
                - table [ref=e409]:
                  - rowgroup [ref=e410]:
                    - row [ref=e411]:
                      - columnheader "Vulnerability" [ref=e412]
