                - generic [ref=e443]: AI generated or assisted reports that include static code analysis without providing clear proof of exploitability and demonstrating practical security impact will not be accepted.
                - generic [ref=e444]: For AI hallucination reports, such as AI suggesting a package that does not exist, we will not be accepting any such report going forward.
                - heading "Out of scope" [level=2] [ref=e445]
                - list [ref=e446]:
                  - listitem [ref=e447]: Automated scanning reports of any kind
                  - listitem [ref=e448]:
                    - text: GitLab sites of third party software and services (marketing services, third-party mail services, developer/support installations etc.)
                    - list [ref=e449]:
                      - listitem [ref=e450]:
                        - text: This includes
                        - code [ref=e451]: gitlab.cn
                        - text: and the JiHu-specific GitLab distribution which are property of GitLab Information Technology (Hubei) Co., Ltd. (JiHu), security issues in those products should be reported to
                        - code [ref=e452]: security@gitlab.cn
                  - listitem [ref=e453]: User content on GitLab.com (for example, a user that is not using proper permissions on their projects containing sensitive information)
                  - listitem [ref=e454]:
                    - text: Access tokens that do not provide access to GitLab company projects/groups/infrastructure or GitLab team member accounts (Please contact the owner of the token (you can find their email address by querying the
                    - code [ref=e455]: /api/v4/user
                    - text: API). If unable to find the token owner's email address you can disclose leaked tokens by creating a confidential issue assigned to the token owner in the project where the token was leaked)
                  - listitem [ref=e456]: Our customers' GitLab installs
                  - listitem [ref=e457]:
                    - text: Intentionally public information and hosts, for example our marketing issues at
                    - link "https://gitlab.com/gitlab-com/marketing" [ref=e458] [cursor=pointer]:
                      - /url: https://gitlab.com/gitlab-com/marketing
                  - listitem [ref=e459]: "Social engineering, phishing, or other fraud including but not limited to: internationalized domain name (IDN) homograph attacks, Right-to-left (RTL) Ambiguity, RTL Override (RTLO), SPF and DKIM issues, most HTML content injection, Tabnabbing"
                  - listitem [ref=e460]: HTML or text injection is eligible only when significant impact can be achieved with minimal user interaction
                  - listitem [ref=e461]: Missing Security Headers (eg. HSTS, CSP) and Missing Secure Flags on Cookies
                  - listitem [ref=e462]: TLS/SSL or SSH issues (weak ciphers/key-size/BEAST/CRIME)
                  - listitem [ref=e463]: CSRF without any security impact
                  - listitem [ref=e464]:
                    - text: User and project enumeration/path disclosure unless an additional impact can be demonstrated
                    - list [ref=e465]:
                      - listitem [ref=e466]:
                        - text: "Reports where an attacker can validate a guess will not be accepted. Examples include but are not limited to:"
                        - list [ref=e467]:
                          - listitem [ref=e468]: An API route returning different status codes depending on if a private path exists or not
                          - listitem [ref=e469]: An identical response but with significantly different timing depending on if a private path exists or not
                          - listitem [ref=e470]: A response validating that a specific email address is registered
                      - listitem [ref=e471]: Reports where an attacker can only disclose the ID of a private element will not be accepted
                  - listitem [ref=e472]:
                    - text: Denial of Service (DoS) issues
                    - list [ref=e473]:
                      - listitem [ref=e474]:
                        - strong [ref=e475]: "Note:"
                        - text: Exceptions may be considered for DoS vulnerabilities that both achieve persistent total service disruption AND can be executed through unauthenticated endpoints. The GitLab security team will determine, at our sole discretion, whether a report falls into this exception
                      - listitem [ref=e476]: Volumetric attack (network flooding, request flooding, port flooding, etc.) submissions are never eligible
                      - listitem [ref=e477]: A scenario where service disruption stops as soon as the requests stop does not qualify as persistent total service disruption, regardless of the request rate.
                  - listitem [ref=e478]:
                    - text: Lack of, or insufficient, rate limiting. (We are aware of the lack of rate-limiting in many places and our application-wide
                    - link "application limits" [ref=e479] [cursor=pointer]:
                      - /url: https://gitlab.com/groups/gitlab-org/-/epics/1737#type-of-limits
                    - text: initiative aims to improve that)
                  - listitem [ref=e480]: Reports about CVEs published on mailing lists, groups etc. without demonstrating an impact on GitLab
                  - listitem [ref=e481]:
                    - text: GitLab Runner reports that do not demonstrate the ability to impact data of other projects or GitLab infrastructure
                    - list [ref=e482]:
                      - listitem [ref=e483]:
                        - text: Note that it is
                        - link "documented behavior" [ref=e484] [cursor=pointer]:
                          - /url: https://docs.gitlab.com/runner/executors/shell.html#security
                        - text: of the Shell Executor to be able to see other projects on the same server
                  - listitem [ref=e485]:
                    - link "Self-managed Runner" [ref=e486] [cursor=pointer]:
                      - /url: https://docs.gitlab.com/runner/security/
                    - text: issues
                  - listitem [ref=e487]:
                    - text: Scenarios in which only the number of private objects is exposed, unless it can be used to extract any sensitive information contained in those objects
                    - list [ref=e488]:
                      - listitem [ref=e489]: For example a report showing that it's possible to see that a certain project has 17 issues even if only 15 are publicly visible would not be accepted
                      - listitem [ref=e490]: However being able to demonstrate that there are 4 confidential issues with the word "SECRET TOKEN" in them would be a valid report
                  - listitem [ref=e491]:
                    - text: Spoofing email and username in git commits that aren't
                    - link "signed with GPG" [ref=e492] [cursor=pointer]:
                      - /url: https://docs.gitlab.com/ee/user/project/repository/signed_commits/gpg.html
                  - listitem [ref=e493]: Clickjacking on pages with no sensitive actions
                  - listitem [ref=e494]: High privilege users (maintainers, owners) using a bug to sabotage/deface their own projects
                  - listitem [ref=e495]:
                    - text: Being able to access attachments directly with a known URL (this is a
                    - link "documented behavior" [ref=e496] [cursor=pointer]:
                      - /url: https://gitlab.com/help/security/user_file_uploads.md
                  - listitem [ref=e497]:
                    - text: EXIF metadata not being stripped from images
                    - list [ref=e498]:
                      - listitem [ref=e499]: We are aware of ways to bypass the EXIF metadata stripping and intend to improve this, but we don't consider this impactful enough to be eligible for bounty
                  - listitem [ref=e500]: Bypassing or creating fake licenses, or bypasses of feature restrictions where there is no security impact
                  - listitem [ref=e501]: Name squatting on dependencies without demonstrating automated impact (e.g. namesquatting a rubygem on rubygems.org where GitLab only ever installs a locally vendored gem)
                  - listitem [ref=e502]: Dangling DNS records on gitlabsandbox.net
                  - listitem [ref=e503]:
                    - text: Ability of banned users to behave as if they are unbanned. We have
                    - link "a confidential epic" [ref=e504] [cursor=pointer]:
                      - /url: https://gitlab.com/groups/gitlab-org/modelops/anti-abuse/-/epics/14
                    - text: to improve this feature.
                  - listitem [ref=e505]: Open redirects - in general these type of issues are informational and we only accept them if chained with other issues in order to create a more severe vulnerability
                  - listitem [ref=e506]: Team member personal data leaked through YouTube videos - unless our own automation missed it.
                  - listitem [ref=e507]:
                    - text: Vulnerabilities in
                    - link "Debian packages in the Package Registry" [ref=e508] [cursor=pointer]:
                      - /url: https://docs.gitlab.com/ee/user/packages/debian_repository/
                  - listitem [ref=e509]: GitLab's ServiceNow platform.
                  - listitem [ref=e510]:
                    - code [ref=e511]: "*.runway.gitlab.net"
                    - text: endpoints
                  - listitem [ref=e512]:
                    - text: "Takeover of S3 buckets, domains or subdomains that are used for testing or if the takeover don't have an impact on GitLab infrastructure or to GitLab customers. Domains listed below are not eligible for vulnerability reports (GitLab reserves the right to adjust this list):"
                    - list [ref=e513]:
                      - listitem [ref=e514]:
                        - code [ref=e515]: "*.gitlab-private.org"
                  - listitem [ref=e516]:
                    - text: CI/CD Variable Disclosure - as it stands, we currently see
                    - link "our guidance to use external secret storage" [ref=e517] [cursor=pointer]:
                      - /url: https://docs.gitlab.com/ee/ci/variables/#cicd-variable-security
                    - text: as sufficient for addressing reports that rely on disclosing Masked CI/CD variables to prove impact.
                  - listitem [ref=e518]: Taking over third party domains, such as external sites linked in old blog posts, or claiming unused employee social media accounts.
                  - listitem [ref=e519]:
                    - text: Attacks that require having a victim share or leak a privileged access token (e.g. personal access token, OAuth token, project or group access token, deploy token,
                    - code [ref=e520]: _gitlab_session
                    - text: token, or runner authentication token). Reports about leaked team member access tokens are still in-scope and eligible for non-CVSS bounties.
                  - listitem [ref=e521]: Attacks requiring physical access to the victim's computer, including employee computer compromise
                  - listitem [ref=e522]: Man-in-the-middle attacks
                  - listitem [ref=e523]:
                    - text: Metadata disclosure, enumeration, and information gathering issues are out of scope unless the researcher demonstrates a
                    - strong [ref=e524]: privacy breach that exposes confidential user data or credentials
                    - text: . GitLab is a collaborative DevOps platform designed for information sharing within projects.
                    - list [ref=e525]:
                      - listitem [ref=e526]:
                        - strong [ref=e527]: "Out of scope examples:"
                        - list [ref=e528]:
                          - listitem [ref=e529]: Enumerating project IDs or determining whether a project exists
                          - listitem [ref=e530]: Accessing branch names, feature flag names, or version information visible to legitimate project members
                          - listitem [ref=e531]: Discovering template names, default configuration settings, or non-sensitive project metadata (creation dates, public descriptions)
                          - listitem [ref=e532]: Extracting version history metadata that does not expose confidential commit content
                      - listitem [ref=e533]:
                        - strong [ref=e534]: "In scope examples (privacy breaches):"
                        - list [ref=e535]:
                          - listitem [ref=e536]: Revealing another user's private email address or credentials
                          - listitem [ref=e537]: Accessing a different project's environment variables, secrets, or confidential CI/CD configuration you don't have legitimate access to
                          - listitem [ref=e538]: Enumerating private repository contents without authorization
                          - listitem [ref=e539]: Extracting confidential data from projects you don't have legitimate access to
                  - listitem [ref=e540]:
                    - text: DSN credentials for
                    - code [ref=e541]: new-sentry.gitlab.net
                    - text: . As per
                    - link "sentry document" [ref=e542] [cursor=pointer]:
                      - /url: https://docs.sentry.io/concepts/key-terms/dsn-explainer/#the-parts-of-the-data-source-name-dsn
                    - text: ":"
                    - blockquote [ref=e543]:
                      - generic [ref=e544]: The secret part of the DSN is optional and effectively deprecated. While clients will still honor it, if supplied, future versions of Sentry will entirely ignore it.
